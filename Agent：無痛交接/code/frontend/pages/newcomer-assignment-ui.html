<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接續 - 指派新人</title>
  <link rel="stylesheet" href="./globals.css">
  <style>
    .newcomer-shell {
      min-height: 100vh;
      background: var(--canvas);
    }

    .newcomer-shell .workspace {
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .newcomer-shell .content-scroll {
      overflow: auto;
      padding: 25px 27px 38px;
    }

    .newcomer-shell .topbar h1 {
      font-size: 24px;
    }

    .topbar-note {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: right;
    }

    .summary-grid,
    .project-strip,
    .bottom-actions {
      width: 100%;
      max-width: 1120px;
      margin-inline: auto;
    }

    .assignment-layout {
      width: 100%;
      max-width: 900px;
      margin-inline: auto;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 17px;
    }

    .summary-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 9px 28px rgba(48, 65, 56, 0.045);
    }

    .summary-card span,
    .summary-card strong {
      display: block;
    }

    .summary-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary-card strong {
      margin-top: 4px;
      font: 500 26px/1.2 Georgia, "Noto Serif TC", serif;
    }

    .project-strip {
      margin-bottom: 17px;
      padding: 18px 22px;
    }

    .project-strip h2 {
      max-width: 760px;
      margin: 5px 0 0;
      font: 500 22px/1.35 Georgia, "Noto Serif TC", serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-strip p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .assignment-layout {
      display: block;
    }

    .assignment-panel {
      min-width: 0;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header > div {
      min-width: 0;
    }

    .panel-header h2 {
      margin: 5px 0 0;
      font: 500 19px/1.4 Georgia, "Noto Serif TC", serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .form-body {
      display: grid;
      gap: 14px;
      padding: 24px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink);
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      border: 1px solid #cfd9d1;
      border-radius: 11px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }

    .form-field input,
    .form-field select {
      min-height: 42px;
      padding: 0 11px;
    }

    .form-field textarea {
      min-height: 92px;
      padding: 11px 12px;
      resize: vertical;
      line-height: 1.7;
    }

    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      outline: 0;
      border-color: #8fa697;
      box-shadow: 0 0 0 3px rgba(86, 119, 102, 0.08);
    }

    .wide-field {
      grid-column: 1 / -1;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-done {
      background: var(--sage-soft);
      color: var(--sage-dark);
    }

    .status-warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .bottom-actions .primary-button,
    .bottom-actions .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      line-height: 1;
      text-decoration: none;
    }

    .bottom-actions .primary-button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 980px) {
      .newcomer-shell .workspace {
        height: auto;
        overflow: visible;
      }

      .newcomer-shell .content-scroll {
        overflow: visible;
        padding: 18px;
      }

    }

    @media (max-width: 760px) {
      .newcomer-shell .topbar {
        position: sticky;
        top: 0;
      }

      .topbar-note {
        display: none;
      }

      .summary-grid,
      .field-grid {
        grid-template-columns: 1fr;
      }

      .bottom-actions {
        display: grid;
      }

      .bottom-actions .primary-button,
      .bottom-actions .ghost-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="newcomer-shell">
    <main class="workspace">
      <header class="topbar">
        <div>
          <div class="score-pill score-warn">離職交接進度：3/3</div>
          <h1>指派新人接手專案</h1>
        </div>
      </header>

      <div class="content-scroll">
        <section class="summary-grid" aria-label="指派狀態摘要">
          <div class="summary-card">
            <span>知識庫狀態</span>
            <strong id="knowledgeStatus">建立中</strong>
          </div>
          <div class="summary-card">
            <span>連動進度</span>
            <strong id="linkStatus">0%</strong>
          </div>
        </section>

        <section class="map-panel project-strip" aria-label="交接專案資訊">
          <div class="eyebrow">PROJECT</div>
          <h2 id="projectTitle">社群成長企劃交接案</h2>
          <p id="projectMeta">交接資料已通過主管審核，知識庫已可供新人連動使用。</p>
        </section>

        <section class="assignment-layout">
          <article class="map-panel assignment-panel">
            <div class="panel-header">
              <div>
                <div class="eyebrow">NEWCOMER ASSIGNMENT</div>
                <h2>新人資料與接手設定</h2>
              </div>
              <span class="status-pill status-warning" id="formStatus">尚未完成</span>
            </div>

            <div class="form-body">
              <div class="field-grid">
                <div class="form-field">
                  <label for="newcomerName">新人姓名</label>
                  <input id="newcomerName" type="text" placeholder="輸入新人姓名">
                </div>

                <div class="form-field">
                  <label for="newcomerEmail">新人信箱</label>
                  <input id="newcomerEmail" type="email" placeholder="輸入新人信箱">
                </div>

                <div class="form-field">
                  <label for="newcomerTitle">接手職稱</label>
                  <input id="newcomerTitle" type="text" placeholder="輸入新人接手職稱">
                </div>

                <div class="form-field">
                  <label for="startDate">預計開始接手日</label>
                  <input id="startDate" type="date">
                </div>

                <div class="form-field wide-field">
                  <label for="supervisorNote">主管給新人的起始說明</label>
                  <textarea id="supervisorNote" placeholder="例如：先照路線圖完成第一週任務，有疑問先查看來源文件，再找主管確認。"></textarea>
                </div>
              </div>
            </div>
          </article>

        </section>

        <div class="bottom-actions">
          <button class="ghost-button" type="button" id="resetBtn">清空重填</button>
          <button class="primary-button" type="button" id="assignBtn" disabled>指派給新人</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.assignmentData = window.assignmentData || {
      projectTitle: "社群成長企劃交接案",
      knowledgeReady: true
    };

    const projectTitle = document.querySelector("#projectTitle");
    const projectMeta = document.querySelector("#projectMeta");
    const knowledgeStatus = document.querySelector("#knowledgeStatus");
    const linkStatus = document.querySelector("#linkStatus");
    const formStatus = document.querySelector("#formStatus");
    const newcomerName = document.querySelector("#newcomerName");
    const newcomerEmail = document.querySelector("#newcomerEmail");
    const newcomerTitle = document.querySelector("#newcomerTitle");
    const startDate = document.querySelector("#startDate");
    const supervisorNote = document.querySelector("#supervisorNote");
    const resetBtn = document.querySelector("#resetBtn");
    const assignBtn = document.querySelector("#assignBtn");

    let assignedNewcomers = [];

    function todayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formComplete() {
      return Boolean(
        newcomerName.value.trim() &&
        newcomerEmail.value.trim() &&
        newcomerTitle.value.trim() &&
        startDate.value.trim() &&
        supervisorNote.value.trim()
      );
    }

    function getFormProgress() {
      const fields = [newcomerName, newcomerEmail, newcomerTitle, startDate, supervisorNote];
      const completedFields = fields.filter((field) => field.value.trim()).length;
      return Math.round((completedFields / fields.length) * 100);
    }

    function renderPage() {
      const ready = Boolean(window.assignmentData.knowledgeReady);
      const done = formComplete();
      const assigned = assignedNewcomers.length > 0;
      const progress = assigned ? 100 : getFormProgress();

      projectTitle.textContent = window.assignmentData.projectTitle || "未命名交接專案";

      knowledgeStatus.textContent = ready ? "建立中" : "建立中";
      linkStatus.textContent = `${progress}%`;

      formStatus.textContent = done ? "已填寫" : "尚未完成";
      formStatus.className = `status-pill ${done ? "status-done" : "status-warning"}`;

      assignBtn.disabled = !done || !ready;
    }

    [newcomerName, newcomerEmail, newcomerTitle, startDate, supervisorNote].forEach((field) => {
      field.addEventListener("input", renderPage);
    });

    assignBtn.addEventListener("click", () => {
      assignedNewcomers.push({
        name: newcomerName.value.trim(),
        email: newcomerEmail.value.trim(),
        title: newcomerTitle.value.trim(),
        startDate: startDate.value,
        note: supervisorNote.value.trim()
      });
      renderPage();
      alert("已完成新人指派。此為前端原型，後續可接 API 建立新人連動。");
    });

    resetBtn.addEventListener("click", () => {
      newcomerName.value = "";
      newcomerEmail.value = "";
      newcomerTitle.value = "";
      startDate.value = "";
      supervisorNote.value = "";
      renderPage();
    });

    startDate.min = todayString();
    renderPage();
  </script>
</body>
</html>
